 function draw(){get("words","notes").then(function(n){document.getElementById("engList").innerHTML=(n||[]).slice(-6).reverse().map(function(x){return '<div class="kv"><span>'+x.t.slice(0,34)+'</span></div>'}).join("")})}draw();});}
function renderChat(){var box=document.getElementById("chatBox"),subjects=["英语","政治","专业课","数学"];get("chat","last").then(function(v){v=v||[];
 box.innerHTML='<div class="row"><select id="sub" class="grow">'+subjects.map(function(s){return '<option>'+s+'</option>'}).join("")+'</select><button class="ghost" id="archive">归档</button></div><div class="chat" id="chatLog"></div><div class="row"><input id="q" class="grow" placeholder="用大白话问，例：古代史线索怎么搭？"><button class="act" id="ask">问</button></div>';
 var log=document.getElementById("chatLog");function draw(){log.innerHTML=v.slice(-30).map(function(m){return '<div class="msg '+m.r+'">'+(m.r==="me"?"我：":"老师：")+m.t+'</div>'}).join("");log.scrollTop=log.scrollHeight}draw();
 document.getElementById("ask").onclick=function(){var q=document.getElementById("q").value;if(!q)return;v.push({r:"me",t:q});draw();put("chat","last",v);document.getElementById("q").value="";var sub=document.getElementById("sub").value;
 if(typeof fetch!=="function"){v.push({r:"ai",t:"（演示）先把问题拆成最小一步：找出最想弄懂的点，只解决它。"});draw();return}
 fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({subject:sub,message:q})}).then(function(r){if(!r.body)throw 0;var reader=r.body.getReader(),dec=new TextDecoder(),idx=v.length,got="";v.push({r:"ai",t:""});reader.read().then(function p(d){if(d.done){put("chat","last",v);return}got+=dec.decode(d.value);v[idx]={r:"ai",t:got};draw();reader.read().then(p)})}).catch(function(){v.push({r:"ai",t:"（演示）关于「"+q+"」，先拆成最小一步，只解决它。"});draw()});};
 document.getElementById("archive").onclick=function(){get("chat","arch").then(function(a){a=a||[];a.push({d:Date.now(),log:v});put("chat","arch",a);v=[];put("chat","last",v);draw()})};});}
function renderSport(){var box=document.getElementById("sportBox");get("sport","today").then(function(m){m=m||0;
 box.innerHTML='<div class="big" id="sec">00:00</div><div class="small">本计时不计入学习预算</div><div style="margin:10px 0"><button class="act" id="st">开始</button> <button class="ghost" id="sp">暂停并累计</button> <button class="ghost" id="rs">归零</button></div><div class="small">今日累计：<span id="acc">'+m+'</span> 分钟</div>';
 var t=0,id=null;function fmt(s){return ("0"+Math.floor(s/60)).slice(-2)+":"+("0"+(s%60)).slice(-2)}
 document.getElementById("st").onclick=function(){if(id)return;id=setInterval(function(){t++;document.getElementById("sec").textContent=fmt(t)},1000)};
 document.getElementById("sp").onclick=function(){clearInterval(id);id=null;m+=Math.round(t/60);put("sport","today",m);document.getElementById("acc").textContent=m;t=0;document.getElementById("sec").textContent="00:00"};
 document.getElementById("rs").onclick=function(){clearInterval(id);id=null;t=0;document.getElementById("sec").textContent="00:00"};});}
function renderAll(){var map={"p-home":renderHome,"p-comb":renderComb,"p-work":renderWork,"p-eng":renderEng,"p-chat":renderChat,"p-sport":renderSport},on=document.querySelector(".page.on");if(on&&map[on.id])map[on.id]()}
openDB().then(renderHome);
})();
</script></body></html>
